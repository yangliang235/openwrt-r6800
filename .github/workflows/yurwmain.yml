name: Build ImmortalWrt for Netgear R6800

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TARGET: ramips
  SUBTARGET: mt7621
  PROFILE: netgear_r6800

jobs:
  build:
    name: Build ImmortalWrt
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev zstd file wget

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: Apply antenna kernel patch
        working-directory: openwrt
        run: |
          SRC=$GITHUB_WORKSPACE/patches/mt76/900-r6800-antenna-3nss.patch
          [ -f "$SRC" ] || { echo "ERROR: $SRC missing"; exit 1; }
          mkdir -p package/kernel/mt76/patches
          cp "$SRC" package/kernel/mt76/patches/900-r6800-antenna-3nss.patch

      - name: Apply antenna DTS fix
        working-directory: openwrt
        run: |
          DTSI=target/linux/ramips/dts/mt7621_netgear_sercomm_bzv.dtsi
          [ -f "$DTSI" ] || DTSI=target/linux/ramips/dts/mt7621_netgear_r6800.dts
          [ -f "$DTSI" ] || { echo "ERROR: DTS/DTSI not found"; exit 1; }

          echo "=== Patching: $DTSI ==="
          sed -i '/ieee80211-freq-limit = <5000000 6000000>/a \\t\\tantenna-mask = <0x7>;' "$DTSI"
          sed -i '/ieee80211-freq-limit = <2400000 2500000>/a \\t\\tantenna-mask = <0x7>;' "$DTSI"

          grep -q "antenna-mask" "$DTSI" || \
            { echo "ERROR: antenna-mask not inserted"; exit 1; }

      - name: Copy custom files into image
        run: |
          set -e
          mkdir -p openwrt/files/etc/uci-defaults
          mkdir -p openwrt/files/etc/sysctl.d
          for f in \
            files/etc/uci-defaults/99-r6800-zram \
            files/etc/sysctl.d/10-r6800-network.conf; do
            [ -f "$f" ] || { echo "ERROR: $f missing"; exit 1; }
            cp "$f" "openwrt/files/${f#files/}"
          done

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write .config
        working-directory: openwrt
        run: |
          cp $GITHUB_WORKSPACE/.config .config
          make defconfig
          grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_netgear_r6800=y" .config || \
            { echo "ERROR: R6800 profile not selected"; exit 1; }

      - name: Enable cfg80211 onus & set Serbia 31dBm
        working-directory: openwrt
        run: |
          # 1) 包选项：mac80211 的 onus 开关是 CONFIG_CFG80211_CERTIFICATION_ONUS
          echo "CONFIG_CFG80211_CERTIFICATION_ONUS=y" >> .config

          # 2) 修改 wireless-regdb 的 db.txt（正确路径在 package/firmware/wireless-regdb/）
          DB=package/firmware/wireless-regdb/db.txt
          [ -f "$DB" ] || { echo "ERROR: $DB not found"; exit 1; }

          # 将 RS 段内的所有 (20)/(23)/(30) 改为 (31)
          sed -i '/^country RS:/,/^$/ s/([0-9]\{1,2\})/(31)/g' "$DB"

          echo "=== RS section after patch ==="
          sed -n '/^country RS:/,/^$/p' "$DB"

          # 3) 确保最终 .config 仍然包含 onus
          grep -q "CONFIG_CFG80211_CERTIFICATION_ONUS=y" .config || \
            { echo "ERROR: onus not set"; exit 1; }

      - name: Download package sources
        working-directory: openwrt
        run: |
          set -o pipefail
          make download -j4 V=s 2>&1 | tail -20

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j4 V=s 2>&1 | tee /tmp/build.log | tail -50

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-R6800-${{ github.run_number }}
          path: openwrt/bin/targets/ramips/mt7621/
          retention-days: 30

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 7
